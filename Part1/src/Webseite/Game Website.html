HIER WAR DER FEHLER: JETZT SIND BEIDE SKRIPTE SAUBER TRENNT
<script>
    // SMART TOGGLE LOGIK
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const toggleBtn = document.getElementById('themeToggle');
        if (currentTheme === 'light') {
            document.documentElement.removeAttribute('data-theme');
            toggleBtn.innerHTML = "☀️ Light Mode";
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            toggleBtn.innerHTML = "🌙 Dark Mode";
        }
    }
</script>

 Offizieller CheerpJ 5.0 Loader aus der Cloud
<script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>

<script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const gameToPlay = urlParams.get('game');

    if (gameToPlay) {
        document.getElementById("game-overlay").style.display = "block";

        try {
            // 1. Initialisiere die Java-Umgebung im Browser
            await cheerpjInit({ version: 11 });

            document.getElementById("loading-text").innerText = "Lade Java-Archiv komplett herunter...";
            cheerpjCreateDisplay(800, 600);

            // 2. Wir holen den exakten relativen Pfad passend zur HTML-Datei
            const relativePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + '/' + gameToPlay;
            const response = await fetch(relativePath);

            if (!response.ok) throw new Error("Datei nicht gefunden");

            // Datei als rohe Binärdaten laden
            const buffer = await response.arrayBuffer();
            const bytes = new Uint8Array(buffer);

            // 3. WICHTIGER FIX: CheerpJ 3.0 verlangt für JS-erstellte Binärdateien zwingend das /str/ Verzeichnis!
            const virtualPath = "/str/" + gameToPlay;
            await cheerpOSAddStringFile(virtualPath, bytes);

            document.getElementById("loading-text").innerText = "Starte " + gameToPlay + "...";

            // 4. Spiel direkt aus dem sicheren /str/ Speicher starten
            await cheerpjRunJar(virtualPath);

            document.getElementById("loading-text").style.display = "none";
        } catch (error) {
            document.getElementById("loading-text").innerHTML = "<span style='color: #ff4d4d;'>Fehler: Spiel konnte nicht geladen werden. Bitte Dateinamen prüfen!</span>";
            console.error(error);
        }
    }
</script>
